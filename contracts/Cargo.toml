[workspace]
resolver = "2"
members = [
    "interfaces",
    "vault",
    "strategy-xoxno",
    "mock-lending",
    "mock-oracle",
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "29.0.1"
nema-interfaces = { path = "interfaces" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
